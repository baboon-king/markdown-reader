<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple and lightweight Markdown reader for desktop and mobile">
    <meta name="theme-color" content="#2c3e50">
    <title>Markdown Reader</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
    <div class="container">
        <header>
            <h1>📖 Markdown Reader</h1>
            <div class="header-actions">
                <input type="file" id="fileInput" accept=".md,.markdown,.txt" style="display: none;">
                <button id="openBtn" class="btn btn-primary" title="Open Markdown file">
                    📁 Open File
                </button>
                <button id="clearHistoryBtn" class="btn btn-secondary" title="Clear recent files">
                    🗑️ Clear History
                </button>
            </div>
        </header>

        <div id="recentFiles" class="recent-files">
            <h3>Recent Files</h3>
            <ul id="recentFilesList"></ul>
        </div>

        <div id="welcomeMessage" class="welcome">
            <h2>Welcome to Markdown Reader</h2>
            <p>A simple, lightweight PWA for reading Markdown files offline.</p>
            <p>Click "Open File" to get started.</p>
            <div class="features">
                <div class="feature">
                    <span class="feature-icon">📱</span>
                    <span>Mobile & Desktop</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">🔌</span>
                    <span>Works Offline</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">💾</span>
                    <span>Remembers Files</span>
                </div>
            </div>
        </div>

        <div id="content" class="content" style="display: none;">
            <div class="content-header">
                <h2 id="fileName"></h2>
                <button id="closeBtn" class="btn btn-secondary" title="Close file">
                    ✕ Close
                </button>
            </div>
            <div id="markdownContent" class="markdown-body"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
